services:
  # Gateway mode. API token and subdomain arrive per request on
  # X-SuperOps-API-Token and X-SuperOps-Subdomain. Do not set those variables
  # or env_file here — that would put static vendor credentials in the
  # container. The project .env is used only for Compose interpolation of
  # CONDUIT_S2S_SECRET. For AUTH_MODE=env, pass SUPEROPS_API_TOKEN and
  # SUPEROPS_SUBDOMAIN on that process instead (see the README).
  superops-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ghcr.io/wyre-ai/superops-mcp:latest
    container_name: superops-mcp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes: {}
